<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login administrator PUSDATIN UMKOE">
    <title>Login Admin | PUSDATIN UMKOE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin/admin-login.css">
</head>
<body>
    <main class="login-wrapper">
        <section class="login-card">
            <a href="../index.html" class="login-brand">
                <span class="brand-icon">P</span>
                <span>
                    <strong>PUSDATIN UMKOE</strong>
                    <small>UNIVERSITAS MUHAMMADIYAH KUPANG</small>
                </span>
            </a>

            <div class="login-heading">
                <span class="eyebrow">ADMINISTRATOR AREA</span>
                <h1>Selamat Datang</h1>
                <p>Silakan masuk untuk mengelola layanan digital PUSDATIN.</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Administrator</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@pusdatin.ac.id"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="loginMessage" class="login-message" role="alert"></p>

                <button type="submit" class="login-button">
                    Masuk ke Dashboard
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <div class="demo-info">
                <strong>Akses demonstrasi</strong>
                <span>Email: admin@pusdatin.ac.id</span>
                <span>Password: Pusdatin123!</span>
            </div>

            <a href="../index.html" class="back-link">
                ← Kembali ke halaman utama
            </a>
        </section>

        <footer class="login-footer">
            © 2026 PUSDATIN Universitas Muhammadiyah Kupang
        </footer>
    </main>

    <script src="../js/admin/auth.js"></script>
</body>
</html>
